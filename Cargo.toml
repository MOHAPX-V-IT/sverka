[package]
name = "sverka"
version = "0.1.0-rc.1"
edition = "2024"
description = "Streaming SHA-256 catalogue snapshot, diff and integrity verification"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
